<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mobiliario Feliz</title>
    <meta name="description" content="Alquiler de mobiliario y decoración para eventos. Mira el catálogo y reserva, o síguenos en Instagram.">
    <meta name="theme-color" content="#E8607A">
    <link rel="icon" href="marcas/mobiliario-feliz/res/mipmap-xxxhdpi/ic_launcher_round.png">
    <!-- Página del QR impreso de Mobiliario Feliz. Sin dependencias: abre
         rápido con datos móviles. Si cambia algún enlace, se cambia AQUÍ y
         el QR ya impreso sigue sirviendo. -->
    <style>
        :root { --coral: #E8607A; --carbon: #2B2B2B; --gris: #6E6A69; --borde: #ECE6E4; }
        * { box-sizing: border-box; }
        body {
            background: #FFFFFF; color: var(--carbon); margin: 0; min-height: 100dvh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center; padding: 32px 20px;
        }
        main { max-width: 380px; text-align: center; width: 100%; }
        .logo { display: block; height: auto; margin: 0 auto 20px; width: 190px; }
        p { color: var(--gris); font-size: 15px; line-height: 1.5; margin: 0 0 28px; }
        a {
            align-items: center; border-radius: 14px; display: flex; font-size: 16px; font-weight: 700;
            gap: 10px; justify-content: center; min-height: 56px; margin-bottom: 12px; padding: 14px 18px;
            text-decoration: none;
        }
        /* Carbón y no coral: blanco sobre coral da 3.3:1, no pasa AA a 16px. */
        .principal { background: var(--carbon); color: #FFFFFF; }
        .secundario { border: 1.5px solid var(--borde); color: var(--carbon); }
        a:focus-visible { outline: 3px solid var(--carbon); outline-offset: 3px; }
        svg { flex: none; height: 20px; width: 20px; }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="marcas/mobiliario-feliz/logo-web.png" alt="Mobiliario Feliz" width="440" height="424">
        <p>Alquiler de mobiliario y decoración para eventos</p>

        <a class="principal" href="index.html?s=mobiliario-feliz">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2M6 9v10M18 9v10M4 19h16"/></svg>
            Ver catálogo y reservar
        </a>
        <a class="secundario" href="https://www.instagram.com/mfe_liz" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
            Síguenos en Instagram
        </a>
    </main>
</body>
</html>

name: Build Android Admin APK

# Caparazón delgado de Capacitor (server.url → GitHub Pages), no una
# copia empaquetada del panel. Por eso este workflow solo necesita
# correr cuando cambia la configuración nativa (capacitor.config.json,
# android/), no en cada push al panel web — el panel real vive en
# GitHub Pages y le llega solo a la app instalada.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'www-shell/**'
      - '.github/workflows/build-android-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # necesario para publicar/actualizar el Release con el APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias de Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Sincronizar el proyecto Android
        run: npx cap sync android

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar el archivo para descargar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk romadetalles-admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: romadetalles-admin-debug-apk
          path: romadetalles-admin.apk

      # Enlace PÚBLICO y permanente (no expira como el artifact de arriba,
      # y no exige iniciar sesión en GitHub para descargar) — este es el
      # que se manda a las clientas en el mensaje de bienvenida.
      - name: Publicar como Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-apk
          name: Panel Admin — APK
          body: >
            APK del panel de administración de RomaDetalles. Este Release
            se reemplaza automáticamente en cada build — siempre tiene la
            versión más reciente del caparazón. El panel en sí (Reservas,
            Artículos, etc.) vive en GitHub Pages y no requiere reinstalar
            la app para actualizarse.
          files: romadetalles-admin.apk

    <meta name="robots" content="noindex">

    <!-- CRÍTICO iOS: el manifiesto se enlaza por JS y solo aquí. Si un
         <link rel="manifest"> estático se sirve también desde index.html,
         Safari puede instalar la PWA apuntando a la tienda pública en vez
         de al panel. El dueño es quien instala; la clienta no. -->
    <script>
        const enlaceManifiesto = document.createElement('link');
        enlaceManifiesto.rel = 'manifest';
        enlaceManifiesto.href = 'manifest.json';
        document.head.appendChild(enlaceManifiesto);
    </script>

    <link rel="icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
